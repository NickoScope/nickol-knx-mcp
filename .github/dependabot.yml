version: 2
updates:
  # Runtime dependencies. Grouped so a quiet week produces one PR, not five.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      python-deps:
        patterns: ["*"]
    ignore:
      # mcp 2.x removed mcp.server.fastmcp (FastMCP -> MCPServer). Verified against
      # mcp 2.2.0: the import raises ModuleNotFoundError. Major bumps stay out until
      # the server is ported; minor and patch updates still come through.
      - dependency-name: mcp
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: deps

  # Action versions. These are pinned by tag and go stale silently.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
